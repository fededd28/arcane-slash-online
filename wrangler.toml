name = "arcane-slash"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# El juego (HTML y JS del navegador) se sirve desde esta carpeta
[assets]
directory = "./public"

# La sala de juego (Durable Object)
[[durable_objects.bindings]]
name = "ROOM"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
